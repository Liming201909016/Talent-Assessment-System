name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Go-based Refactored System/**'

jobs:
  # 在 PR 上自动运行回归测试摘要
  pr-summary:
    name: PR Quality Summary
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: 'Go-based Refactored System/go.sum'

      - name: Run tests with coverage
        id: test
        working-directory: 'Go-based Refactored System'
        run: |
          go test ./... -count=1 -coverprofile=coverage.out 2>&1 | tee test-output.txt
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          PASSED=$(grep -c "^--- PASS" test-output.txt || echo 0)
          FAILED=$(grep -c "^--- FAIL" test-output.txt || echo 0)
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Comment PR summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const passed = '${{ steps.test.outputs.passed }}';
            const failed = '${{ steps.test.outputs.failed }}';
            const coverage = '${{ steps.test.outputs.coverage }}';
            const status = failed === '0' ? '✅' : '❌';
            const body = `## ${status} PR 质量摘要

            | 指标 | 数值 |
            |------|------|
            | 测试通过 | ${passed} |
            | 测试失败 | ${failed} |
            | 覆盖率 | ${coverage || 'N/A'} |

            <details>
            <summary>📋 检查清单（建议）</summary>

            - [ ] 涉及的业务链是否在 \`docs/business-chains.md\` 中？
            - [ ] 修改的 handler 是否有对应单元测试？
            - [ ] 是否触发已知陷阱（参考 \`.github/copilot-instructions.md\` §5.1-5.7）？
            - [ ] 安全审查（路径穿越/SQL 注入/输入校验）？
            - [ ] 是否需要更新 \`docs/project-memory.md\`？
            </details>

            > 由 GitHub Actions 自动生成 · [详细日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
